[package]
name = "reasonframe"
version = "0.1.0-rc.2"
description = "Reasonframe desktop application shell"
edition = "2021"

[lib]
name = "reasonframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
